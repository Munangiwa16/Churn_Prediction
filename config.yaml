# config.yaml
# Configuration file for Churn Prediction Project

# Data Paths
data:
  train_path: "./data/train.csv"
  test_path: "./data/test.csv"
  index_col: "id"

# Preprocessing
preprocessing:
  train_test_split: 0.75
  random_state: 42
  stratified: true

# Feature Engineering
feature_engineering:
  clustering:
    n_clusters: 3
    random_state: 2026
    algorithm: "kmeans"

# Scaling
scaling:
  method: "standard"
  numerical_features:
    - "MonthlyCharges"
    - "TotalCharges"
    - "tenure"

# Model Configuration
models:
  random_forest:
    n_estimators: [100, 500, 1000]
    max_depth: [3, 5, 7, 10, null]
    class_weight: ["balanced", null]
    min_samples_split: [2, 5, 10, 20]
    cv_folds: 5
    n_iter: 20
  
  xgboost:
    n_estimators: [100, 500, 1000]
    max_depth: [3, 5, 7, 10, null]
    learning_rate: [0.01, 0.05, 0.1]
    reg_alpha: [0.001, 0.01, 0.1]
    reg_lambda: [0.001, 0.01, 0.1]
    cv_folds: 5
    n_iter: 20
  
  catboost:
    iterations: [100, 500, 1000]
    max_depth: [3, 5, 7, 10, null]
    learning_rate: [0.01, 0.05, 0.1]
    l2_leaf_reg: [0.001, 0.01, 0.1]
    cv_folds: 5
    n_iter: 20
  
  lightgbm:
    n_estimators: [100, 500, 1000]
    learning_rate: [0.01, 0.05, 0.1]
    num_leaves: [1, 50, 100]
    lambda_l1: [0.01, 0.1, 0.001]
    lambda_l2: [0.001, 0.01, 0.1]
    max_depth: [3, 5, 7, 10, null]
    cv_folds: 5
    n_iter: 20

# Training
training:
  scoring_metric: "roc_auc"
  random_state: 42
  n_jobs: -1
  verbose: 1

# Output
output:
  models_path: "./models/"
  reports_path: "./reports/"
  save_models: true
  save_predictions: true
